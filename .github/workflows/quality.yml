name: Calidad y seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Aplicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run lint
      - run: npm run build
      # Next genera .next/types durante el build; el typecheck debe ejecutarse
      # después para que el resultado sea reproducible desde un checkout limpio.
      - run: npm run typecheck
      - name: Instalar navegadores para pruebas de interfaz
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Rechazar secretos rastreados
        shell: bash
        run: |
          if git ls-files --error-unmatch .env.local >/dev/null 2>&1; then
            echo ".env.local no debe estar rastreado por Git" >&2
            exit 1
          fi

  database:
    name: RLS y pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.101.0
      - name: Preparar proyecto Supabase efímero
        shell: bash
        run: |
          mkdir -p .ci-supabase
          cd .ci-supabase
          supabase init
          cat ../supabase/schema.sql ../supabase/functions.sql > supabase/migrations/20260101000000_initial.sql
          cp ../supabase/tests/rls_seguridad.sql supabase/tests/rls_seguridad.sql
          cp ../supabase/tests/admin_rls.sql supabase/tests/admin_rls.sql
      - name: Iniciar base local
        working-directory: .ci-supabase
        run: supabase start
      - name: Ejecutar pruebas RLS
        working-directory: .ci-supabase
        run: supabase test db
